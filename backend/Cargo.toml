[package]
name = "dbx-plugin-xingxi-game"
version = "0.6.1"
edition = "2021"
license = "MIT"

[dependencies]
dbx-plugin-sdk = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[profile.release]
# 插件二进制别做太肥：默认 release 会留下大量符号与未优化的泛型代码
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
