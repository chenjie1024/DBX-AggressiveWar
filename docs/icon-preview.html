<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" />
<style>
  body { margin:0; padding:24px 26px; background:#0b0d11; color:#e5e7eb; font:13px/1.5 system-ui,"Segoe UI",sans-serif; }
  h1 { font-size:15px; margin:0 0 4px; }
  p { margin:0 0 18px; color:#7b8494; font-size:12px; }
  .row { display:flex; gap:26px; align-items:flex-end; }
  .box { text-align:center; }
  .dark { background:#14161b; border:1px solid #262a33; border-radius:12px; padding:14px; }
  .light { background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:14px; color:#334155; }
  .big { width:120px; height:120px; }
  .mid { width:64px; height:64px; }
  .small { width:32px; height:32px; }
  .tiny { width:24px; height:24px; }
  .cap { font-size:11px; color:#8b93a1; margin-top:8px; }
  .light .cap { color:#64748b; }
</style></head>
<body>
  <h1>新图标：地球轨道（AggressiveWar）</h1>
  <p>深色界面是主要场景；同时检查浅色底与 24/32px 小尺寸的可读性。</p>
  <div class="row">
    <div class="box dark"><img class="big" src="../assets/icon.svg" alt=""><div class="cap">120px · 深色</div></div>
    <div class="box dark"><img class="mid" src="../assets/icon.svg" alt=""><div class="cap">64px</div></div>
    <div class="box dark"><img class="small" src="../assets/icon.svg" alt=""><div class="cap">32px</div></div>
    <div class="box dark"><img class="tiny" src="../assets/icon.svg" alt=""><div class="cap">24px</div></div>
    <div class="box light"><img class="big" src="../assets/icon.svg" alt=""><div class="cap">120px · 浅色</div></div>
    <div class="box light"><img class="small" src="../assets/icon.svg" alt=""><div class="cap">32px</div></div>
  </div>
</body></html>
