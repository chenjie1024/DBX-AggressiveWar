<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; padding: 22px 26px; background: #0b0d11; color: #e5e7eb; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  p  { margin: 0 0 18px; color: #7b8494; font-size: 12px; }
  .row { display: flex; gap: 22px; }
  .card { background: #14161b; border: 1px solid #262a33; border-radius: 12px; padding: 14px; width: 200px; text-align: center; }
  .card img { width: 112px; height: 112px; display: block; margin: 0 auto 10px; border-radius: 24px; }
  .small { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; color: #8b93a1; font-size: 11px; }
  .small img { width: 28px; height: 28px; border-radius: 6px; }
  .tag { display: inline-block; margin-top: 8px; padding: 1px 8px; border-radius: 999px; background: #1f2937; color: #93c5fd; font-size: 11px; }
  .name { font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
  <h1>AggressiveWar 图标方案（4 选 1）</h1>
  <p>同一套配色下四种意象：剑盾 / 王冠棋兵 / 地球双剑 / 区域征战。右侧小图是列表里的实际大小。</p>
  <div class="row">
    <div class="card">
      <img src="a-shield-sword.svg" alt="A" />
      <div class="name">A · 剑与盾</div>
      <div class="small"><img src="a-shield-sword.svg" alt="" /><span>28px</span></div>
      <div class="tag">最接近现版本</div>
    </div>
    <div class="card">
      <img src="b-crown-pawns.svg" alt="B" />
      <div class="name">B · 王冠与棋兵</div>
      <div class="small"><img src="b-crown-pawns.svg" alt="" /><span>28px</span></div>
      <div class="tag">最像策略游戏</div>
    </div>
    <div class="card">
      <img src="c-globe-blades.svg" alt="C" />
      <div class="name">C · 地球双剑</div>
      <div class="small"><img src="c-globe-blades.svg" alt="" /><span>28px</span></div>
      <div class="tag">呼应真实地图</div>
    </div>
    <div class="card">
      <img src="d-regions-arrow.svg" alt="D" />
      <div class="name">D · 区域征战</div>
      <div class="small"><img src="d-regions-arrow.svg" alt="" /><span>28px</span></div>
      <div class="tag">最贴玩法</div>
    </div>
  </div>
</body>
</html>
